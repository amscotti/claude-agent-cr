# .ameba.yml

# This configuration file was generated by `ameba --gen-config`.
# It contains the default configuration for Ameba.

# Global configuration
#
# Excludes:
# list of patterns to exclude from the analysis.
#
# Excluded:
#   - lib
#   - spec
#   - tmp
#
# FailOnWarnings:
# boolean (false by default)
#
Excluded:
  - lib
  - tmp
  - bin
  # Reference adapters require optional redis/pg shards; not part of the core library.
  - examples/session-stores/redis_session_store.cr
  - examples/session-stores/postgres_session_store.cr

# Rule configuration
#
# To disable a rule, set `Enabled: false`.
#
# Metrics/LineLength:
#   Enabled: false
#
# To configure a rule, set the parameter.
#
# Metrics/LineLength:
#   Max: 120
#
Metrics/LineLength:
  Max: 120

# Ameba 1.7 style rules that are noisy against existing Crystal idioms in this
# repo (JSON fixtures, explicit `return nil`, multi-type unions, example rescues).
Style/RedundantNilInControlExpression:
  Enabled: false
Style/HeredocIndent:
  Enabled: false
Style/VerboseNilType:
  Enabled: false
Style/MultilineCurlyBlock:
  Enabled: false
Lint/SpecEqWithBoolOrNilLiteral:
  Enabled: false
Lint/UnusedRescueVariable:
  Enabled: false
Lint/ElseNil:
  Enabled: false
